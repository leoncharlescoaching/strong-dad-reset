<script>
  (function() {
    var track = document.getElementById('marquee-track');
    if (!track) return;

    var pos = 0;
    var speed = 0.5;
    var halfWidth = null;

    function step() {
      if (!halfWidth) halfWidth = track.scrollWidth / 2;
      pos += speed;
      if (pos >= halfWidth) pos = 0;
      track.style.transform = 'translateX(-' + pos + 'px)';
      requestAnimationFrame(step);
    }

    window.addEventListener('load', function() {
      halfWidth = track.scrollWidth / 2;
      requestAnimationFrame(step);
    });
  })();

  function submitToMailchimp(fname, email, formId, successId, btnId) {
    var btn = document.getElementById(btnId);
    var form = document.getElementById(formId);
    var success = document.getElementById(successId);

    if (!btn || !form || !success) return;

    btn.disabled = true;
    btn.textContent = 'ADDING YOU TO THE LIST...';

    var callbackName = 'mc_callback_' + Date.now();
    var script = document.createElement('script');

    var baseUrl = 'https://lookgoodfitness.us5.list-manage.com/subscribe/post-json';

    var params =
      '?u=9d11a72a3736b1f1dd92fdfc9' +
      '&id=b895da0481' +
      '&f_id=003f8ce3f0' +
      '&EMAIL=' + encodeURIComponent(email) +
      '&FNAME=' + encodeURIComponent(fname) +
      '&MERGE1=' + encodeURIComponent(fname) +
      '&MMERGE1=' + encodeURIComponent(fname) +
      '&NAME=' + encodeURIComponent(fname) +
      '&tags=3512589' +
      '&b_9d11a72a3736b1f1dd92fdfc9_b895da0481=' +
      '&c=' + callbackName;

    var finished = false;

    function showSuccess() {
      if (finished) return;
      finished = true;

      form.style.display = 'none';
      success.style.display = 'block';

      if (script.parentNode) {
        script.parentNode.removeChild(script);
      }

      try {
        delete window[callbackName];
      } catch (e) {
        window[callbackName] = undefined;
      }
    }

    window[callbackName] = function(data) {
      console.log('Mailchimp response:', data);
      showSuccess();
    };

    script.src = baseUrl + params;

    script.onerror = function() {
      btn.disabled = false;
      btn.textContent = 'GET PRIORITY ACCESS';
      alert('Something went wrong. Please try again.');
    };

    document.body.appendChild(script);

    setTimeout(showSuccess, 2500);
  }

  function handleSubmit(event) {
    event.preventDefault();

    var fn = document.getElementById('fname').value.trim();
    var em = document.getElementById('email').value.trim();

    if (!fn || !em) {
      alert('Please fill in your name and email.');
      return;
    }

    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)) {
      alert('Please enter a valid email address.');
      return;
    }

    submitToMailchimp(fn, em, 'lead-form-1', 'success-box', 'submit-btn-1');
  }

  function handleSubmit2(event) {
    event.preventDefault();

    var fn = document.getElementById('fname2').value.trim();
    var em = document.getElementById('email2').value.trim();

    if (!fn || !em) {
      alert('Please fill in your name and email.');
      return;
    }

    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)) {
      alert('Please enter a valid email address.');
      return;
    }

    submitToMailchimp(fn, em, 'lead-form-2', 'success-box-2', 'submit-btn-2');
  }
</script>
