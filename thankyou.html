<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>You're on the list — The Strong Dad Reset</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000000; color: #ffffff; font-family: 'Barlow', Arial, sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 20px; text-align: center; }
  .logo { max-width: 400px; width: 100%; margin-bottom: 48px; }
  .tick { width: 72px; height: 72px; background: #E24B4A; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 32px; font-size: 32px; font-weight: 900; color: #fff; }
  h1 { font-family: 'Anton', sans-serif; font-size: clamp(36px, 6vw, 64px); color: #ffffff; text-transform: uppercase; margin-bottom: 16px; line-height: 1; }
  h1 span { color: #E24B4A; }
  p { font-size: 18px; color: #9ca3af; line-height: 1.7; max-width: 480px; margin: 0 auto 12px; }
  p strong { color: #ffffff; }
  .divider { width: 60px; height: 3px; background: #E24B4A; margin: 32px auto; }
  .detail { font-size: 15px; color: #6b7280; max-width: 440px; margin: 0 auto; line-height: 1.7; }
</style>
</head>
<body>
  <img src="The_Strong_Dad_Reset_.png" alt="The Strong Dad Reset" class="logo">
  <div class="tick">✓</div>
  <h1>You're on<br>the <span>list.</span></h1>
  <p>Keep an eye on your inbox.</p>
  <p><strong>Spaces open Friday 29th May.</strong> As a priority list member you get first access and early bird pricing before anyone else.</p>
  <div class="divider"></div>
  <p class="detail">Between now and then I'm going to send you a few emails. Actually read them. They're not the usual bullshit filler you ignore.</p>
</body>
</html>
